<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Oddweb</title>
  <desc id="desc">Oddweb, an index of the web's odd corners</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#d9aa7a" stroke-width="2" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f2dfbd"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="52" y="48" width="1096" height="534" fill="#fff9e9" stroke="#2a1810" stroke-width="8"/>
  <rect x="76" y="72" width="1048" height="94" fill="#2a1810"/>
  <rect x="100" y="95" width="48" height="48" fill="#fff9e9" stroke="#d9aa7a" stroke-width="4"/>
  <text x="124" y="133" fill="#2a1810" font-family="ui-monospace, monospace" font-size="42" font-weight="700" text-anchor="middle">!</text>
  <text x="174" y="139" fill="#fff9e9" font-family="ui-monospace, monospace" font-size="58" font-weight="700" letter-spacing="8">ODDWEB</text>
  <rect x="100" y="206" width="1000" height="270" fill="#b74624" stroke="#2a1810" stroke-width="5"/>
  <text x="146" y="292" fill="#fff9e9" font-family="ui-monospace, monospace" font-size="34" font-weight="700" letter-spacing="4">NO ALGORITHMS, NO FEEDS</text>
  <text x="146" y="376" fill="#fff9e9" font-family="ui-monospace, monospace" font-size="68" font-weight="700">THE WEB'S</text>
  <text x="146" y="446" fill="#fff9e9" font-family="ui-monospace, monospace" font-size="68" font-weight="700">ODD CORNERS</text>
  <text x="102" y="535" fill="#5f4639" font-family="ui-monospace, monospace" font-size="29" font-weight="700">A HAND-FILED DIRECTORY OF CURIOUS DETOURS</text>
</svg>
